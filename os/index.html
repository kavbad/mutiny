<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutiny, Your move (section prototype v30)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f0ea; --ink:#141210; --ink-72:rgba(20,18,16,.72); --ink-48:rgba(20,18,16,.48); --ink-28:rgba(20,18,16,.28);
  --ash:#8d877b; --rule:rgba(20,18,16,.13);
  --orange:#D85A30; --orange-deep:#B9481F; --orange-text:#B9481F;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  --mono:'Spline Sans Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.72,.12,1);
  --u:8px; --g:clamp(20px,3vw,48px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141210; --ink:#f2f0ea; --ink-72:rgba(242,240,234,.74); --ink-48:rgba(242,240,234,.5); --ink-28:rgba(242,240,234,.3);
    --ash:#8d877b; --rule:rgba(242,240,234,.14); --orange-text:#E8764E;
  }
}
:root[data-theme="dark"]{
  --paper:#141210; --ink:#f2f0ea; --ink-72:rgba(242,240,234,.74); --ink-48:rgba(242,240,234,.5); --ink-28:rgba(242,240,234,.3);
  --ash:#8d877b; --rule:rgba(242,240,234,.14); --orange-text:#E8764E;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[tabindex="-1"]:focus{outline:none}
[style*="--c"]{--ct:color-mix(in oklab,var(--c) 58%,var(--ink))}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}

.ym{height:100svh;display:flex;flex-direction:column;padding:calc(var(--u)*2) var(--g) calc(var(--u)*1.5);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:24px}
.top-right{display:flex;gap:26px;align-items:center}


.body{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:calc(var(--u)*1)}
.body{--padl:132px;--tray:300px}
.divider{flex:none;position:relative;height:22px;margin:0 0 0 var(--padl);display:flex;align-items:center;justify-content:center;gap:10px;cursor:row-resize;user-select:none;touch-action:none}
.divider::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule)}
.divider .grip{width:56px;height:5px;border-radius:3px;background:var(--ink-48);position:relative;transition:background .2s,transform .2s}
.divider:hover .grip,.divider.drag .grip{background:var(--ink);transform:scaleX(1.15)}
.divider .dv{position:relative;width:22px;height:22px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink-48);transition:color .2s,border-color .2s}
.divider .dv svg{width:12px;height:12px}
.divider .dv:hover{color:var(--ink);border-color:var(--ink)}
.body.max .field{flex:1}
.body.max .tray{height:0!important;padding-top:0;padding-bottom:0;overflow:hidden}
.body.min .field{flex:0 0 0px;min-height:0;overflow:hidden}
.body.min .tray{flex:1;height:auto!important;max-height:none!important}
.body.min .divider .dv[data-snap="min"],.body.max .divider .dv[data-snap="max"]{display:none}
.body.min .divider,.body.max .divider{cursor:default}
.field{flex:1;min-height:160px;position:relative}
.tray{flex:none;width:auto;margin:0;padding:10px 0 0 var(--padl,132px)}
.chat{flex:none;width:auto;margin:0 calc(-1*var(--g)) calc(-1*var(--u)*1.5);padding:14px var(--g) 18px;background:color-mix(in oklab,var(--paper) 62%,#fff);border-top:1px solid var(--rule);box-shadow:0 -24px 48px -28px rgba(20,18,16,.28)}
.chat .ask{max-width:none;margin:0 0 0 var(--padl,132px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chat{background:color-mix(in oklab,var(--paper) 80%,#fff);box-shadow:0 -24px 48px -28px rgba(0,0,0,.6)}}
:root[data-theme="dark"] .chat{background:color-mix(in oklab,var(--paper) 80%,#fff)}

/* ---- left: the one thing on screen ---- */
.who{display:flex;align-items:baseline;gap:12px;font-size:15px}
.who b{font-weight:500}
.who span{color:var(--ink-48)}
.ft{font-size:13px;color:var(--ink-48)}
.left{min-width:0}
.pane{animation:pane .5s var(--ease) both;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 40px;align-items:start}
@keyframes pane{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[style*="--c"]{--ct:color-mix(in oklab,var(--c) 66%,var(--ink))}

.pane{animation:pane .4s var(--ease) both;width:100%}
.tray{height:var(--tray);max-height:none;overflow:auto;scrollbar-width:thin;padding:6px 0 14px var(--padl,132px);transition:height .25s var(--ease);scroll-behavior:smooth;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 22px);mask-image:linear-gradient(to bottom,transparent,#000 22px)}
.thread{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.body.inroom{--tray:150px}
.body.sized{--tray:var(--trayset)}
.body.sized.inroom{--tray:var(--trayset)}
.msg{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 10px;max-width:64%;animation:pane .35s var(--ease) both}
.msg .av{width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;margin-top:1px}
.msg .av::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.msg .who{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-48);margin-top:3px}
.msg .who b{font-weight:500;color:var(--ink)}
.msg .who .side{white-space:nowrap}
.msg .who .side::before{content:"\00b7";margin-right:8px}
.msg .who .side i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px}
.msg .body{margin-top:5px;padding:10px 13px;border-radius:2px 12px 12px 12px;background:color-mix(in oklab,var(--ink) 5%,var(--paper));font-size:14px;line-height:1.5;color:var(--ink)}
.msg .body p{margin:0}
.msg .body p+p{margin-top:8px;color:var(--ink-72)}
.msg .body p.lead{font-weight:500}
.msg .body p b{font-weight:500}
.msg .body p button{font-weight:500;color:var(--ink);box-shadow:inset 0 -1px 0 var(--c)}
.msg .body p button:hover{color:var(--ct)}
.you{align-self:flex-end;max-width:56%;animation:pane .3s var(--ease) both}
.you .body{padding:9px 13px;border-radius:12px 12px 2px 12px;background:var(--ink);color:var(--paper);font-size:14px;line-height:1.5}
.replies{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;animation:pane .35s .25s var(--ease) both}
.rp{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--ink-28);background:var(--paper);color:var(--ink);font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.rp:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rp:active{transform:translateY(1px)}
.rp.p{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rp.p:hover{background:var(--orange);border-color:var(--orange);color:#fff}
.rp.alt{color:var(--ink-72)}
.rp.auto{box-shadow:0 0 0 3px var(--paper),0 0 0 4px var(--ink)}
.rp.cta{background:var(--orange);border-color:var(--orange);color:#fff;text-decoration:none}
.rp.cta:hover{background:var(--orange-deep);border-color:var(--orange-deep)}
.rp.cta svg{width:14px;height:14px}
.att{margin-top:12px;animation:pane .35s .15s var(--ease) both}
.status{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-48);font-variant-numeric:tabular-nums}
.status b{font-weight:500;color:var(--ink)}
.prog{height:3px;background:var(--rule);border-radius:2px;margin-top:8px;overflow:hidden;display:flex}
.prog i{display:block;height:100%;flex:0 0 auto;background:var(--c)}
.feed{margin:8px 0 0;padding:0;list-style:none}
.feed li{display:grid;grid-template-columns:7px minmax(0,1fr) auto;gap:9px;align-items:center;font-size:13.5px;color:var(--ink-72);animation:pane .3s var(--ease) both}
.feed li .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.feed li .a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed li b{font-weight:500;color:var(--ct);margin-right:6px}
.feed li .ft{font-size:12px;color:var(--ink-48)}
.feed li.you .dot{background:var(--ink)}
.feed li.you b{color:var(--ink)}
.split{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px}
.split i{display:block;height:100%;background:var(--c)}
.log{position:absolute;left:var(--padl);right:0;top:64px;bottom:0;overflow:hidden;animation:pane .5s .1s var(--ease) both}
.log ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:5em minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.log li.new .a{font-style:italic;font-weight:500;color:var(--ct)}
.log li.new .k:first-child{color:var(--ct)}
.log .k{margin:0}
.ask{display:flex;align-items:center;gap:14px;height:58px;padding:0 9px 0 18px;border:1px solid var(--ink-28);border-radius:6px;background:color-mix(in oklab,var(--paper) 25%,#fff);box-shadow:0 1px 2px rgba(20,18,16,.06),0 8px 24px -16px rgba(20,18,16,.25);transition:border-color .2s,box-shadow .2s}
.ask:focus-within{border-color:var(--ink);box-shadow:0 1px 2px rgba(20,18,16,.06),0 12px 28px -16px rgba(20,18,16,.35)}
.ask::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}
.ask input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.ask input::placeholder{color:var(--ink-48)}
.ask .send{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;color:var(--paper);background:var(--ink);transition:background .2s,transform .2s}
.ask .send:hover{background:var(--orange)}
.ask .send:active{transform:translateY(1px)}
.ask .send svg{width:18px;height:18px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ask{background:color-mix(in oklab,var(--paper) 85%,#fff)}}
:root[data-theme="dark"] .ask{background:color-mix(in oklab,var(--paper) 85%,#fff)}

.roompanel{position:absolute;left:var(--padl);right:0;top:92px;height:calc(100% - 92px);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:0 56px;animation:pane .5s .1s var(--ease) both;min-height:0}
.log{position:static;overflow:hidden;animation:none}
.log:not(.open) li:nth-child(n+4){display:none}
.log.open ol{max-height:calc(100% - 40px);overflow:auto}
.log{min-height:0;max-height:100%;display:flex;flex-direction:column}
.log .more{flex:none;align-self:flex-start}
.log li .a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .more{display:inline-block;margin-top:8px;font-size:13px;font-weight:500;color:var(--ink-72);border-bottom:1px solid var(--ink-28)}
.log .more:hover{color:var(--ink);border-color:var(--ink)}
.wgs{display:grid;grid-template-columns:1fr 1fr;gap:28px 44px;align-content:start;overflow:auto;min-height:0;padding-right:4px;scrollbar-width:thin}
.wg{min-width:0;padding-top:10px;border-top:1px solid var(--rule)}
.wg.wide{grid-column:1/-1}
.wg h6{margin:0 0 10px;font-size:13px;font-weight:400;color:var(--ink-48)}
.kv{font-weight:500;font-size:clamp(24px,2.2vw,32px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kc{margin-top:8px;font-size:13px;color:var(--ink-48);line-height:1.4}
.w{display:block;width:100%;height:60px;margin-top:12px}
.w .ln{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.w .pj{fill:none;stroke:var(--c);stroke-width:1.5;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.w .tg{stroke:var(--ink-28);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.w .dt{fill:var(--c)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:9em minmax(0,1fr) 3em;gap:12px;align-items:center;font-size:13px}
.bar .bl{color:var(--ink-72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{height:6px;background:var(--rule);border-radius:2px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--ink)}
.bar .bt i.hi{background:var(--c)}
.bar .bv{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cells i{width:12px;height:12px;border-radius:2px;background:var(--rule)}
.cells i.on{background:var(--c)}
.cells i.wr{background:color-mix(in oklab,var(--orange) 55%,var(--paper))}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--rule)}
.tl li:last-child{border-bottom:0}
.tl .td{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .tt{color:var(--ink-48);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl li.now .tt{color:var(--ct);font-weight:500}
.tl li.done .tt{color:var(--ink-28)}
@media (max-width:900px){.roompanel{grid-template-columns:1fr;overflow:auto}.wgs{grid-template-columns:1fr}}

/* ---- live surfaces ---- */
.lv{display:flex;flex-direction:column;min-height:0;border:1px solid var(--rule);border-radius:4px;background:color-mix(in oklab,var(--paper) 92%,#fff);overflow:hidden;transition:box-shadow .3s}
.lv.flash{box-shadow:0 0 0 1.5px var(--c)}
.lv-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:12px;color:var(--ink-48)}
.lv-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.lv-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-72)}
.lv-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-28);flex:none}
.lv.busy .lv-dot{background:var(--c);animation:pulse 1s ease-in-out infinite}
.lv-body{flex:1;min-height:0;overflow:auto;padding:10px 12px;font-size:13px;line-height:1.45}
.lv-list,.lv-check,.lv-code{list-style:none;margin:0;padding:0}
.lv-list li{display:grid;grid-template-columns:9em minmax(0,1fr) auto;gap:12px;padding:6px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.lv-from{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-sub{color:var(--ink-72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-when{color:var(--ink-48);font-size:12px;white-space:nowrap}
.lv-doc p{margin:0 0 10px;color:var(--ink);max-width:62ch}
.lv-code li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;font-family:var(--mono);font-size:12px;line-height:1.7;counter-increment:ln}
.lv-code li::before{content:counter(ln);color:var(--ink-28);text-align:right}
.lv-code{counter-reset:ln}
.lv-code code{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.lv-tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.lv-tbl th{text-align:left;font-weight:400;font-size:11.5px;color:var(--ink-48);padding:0 8px 6px 0;border-bottom:1px solid var(--rule)}
.lv-tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14em}
.lv-check li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}
.lv-check li i{width:12px;height:12px;border:1.5px solid var(--ink-28);border-radius:2px;flex:none}
.lv-check li.ok i{background:var(--c);border-color:var(--c)}
.lv .new{background:color-mix(in oklab,var(--c) 10%,transparent);box-shadow:inset 2px 0 0 var(--c);transition:opacity .35s,background .6s;animation:pane .25s var(--ease) both}
.lv .new.done{background:color-mix(in oklab,var(--c) 16%,transparent)}
.lv .new.fade{opacity:0}
.lv-doc .new{padding-left:10px}
.lv-code .new code::before{content:"+ ";color:var(--ct)}
.lv.mini .lv-body{font-size:10.5px;padding:6px 8px;pointer-events:none}
.lv.mini .lv-bar{padding:5px 8px;font-size:10px}
.lv.mini .lv-list li{grid-template-columns:6em minmax(0,1fr);gap:6px;padding:3px 0}
.lv.mini .lv-when,.lv.mini .lv-kind{display:none}
.lv.mini .lv-code li{font-size:9.5px;line-height:1.5}
.lv.mini .lv-tbl td,.lv.mini .lv-tbl th{padding:3px 6px 3px 0;font-size:10px}
.lv.mini .lv-doc p{margin:0 0 5px}
.lv.mini .lv-check li{padding:3px 0}

/* room: brief and live, together or alone */
.roompanel{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:0 40px}
.roompanel.m-brief{grid-template-columns:1fr}
.roompanel.m-brief .briefcol{grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:0 56px}
.roompanel.m-brief .lvcol{display:none}
.roompanel.m-live{grid-template-columns:1fr}
.roompanel.m-live .briefcol{display:none}
.briefcol{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 32px;min-height:0;align-content:start}
.roompanel:not(.m-brief) .briefcol{grid-template-columns:1fr;gap:0}
.roompanel:not(.m-brief) .briefcol .log{display:none}
.roompanel:not(.m-brief) .wgs{grid-template-columns:1fr 1fr;gap:20px 28px}
.lvcol{min-height:0;display:flex;flex-direction:column}
.lvcol .lv{flex:1}
.modes{position:absolute;right:0;top:56px;display:flex;gap:2px;border:1px solid var(--rule);border-radius:4px;padding:2px;font-size:12px}
.modes button{padding:4px 10px;border-radius:3px;color:var(--ink-48);font-weight:500}
.modes button.on{background:var(--ink);color:var(--paper)}
.modes .sep{width:1px;height:16px;background:var(--rule);margin:0 4px;align-self:center}
.modes .ic{width:26px;height:26px;padding:0;display:grid;place-items:center;color:var(--ink-48)}
.modes .ic svg{width:14px;height:14px}
.modes .ic:hover{color:var(--ink)}
.body.max .modes .ic[data-snap="max"],.body.min .modes .ic[data-snap="min"]{color:var(--ink);background:color-mix(in oklab,var(--ink) 8%,var(--paper))}

/* everything live at once */
.lvgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:12px;animation:pane .4s var(--ease) both}
.lvcell{display:flex;flex-direction:column;min-height:0;text-align:left;border-radius:4px;transition:transform .2s}
.lvcell:hover{transform:translateY(-1px)}
.lvcell .lvname{font-size:11.5px;font-weight:500;color:var(--ct);margin:0 0 4px 2px;display:flex;align-items:center;gap:6px}
.lvcell .lvname::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.lvcell .lv{flex:1}
.field.grid canvas,.field.grid #labels,.field.grid .marks,.field.grid .livebox{display:none}
@media (max-width:900px){.lvgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.roompanel{grid-template-columns:1fr}.modes{top:-30px}}

/* ---- right: the company ---- */
.field{position:relative;min-height:0;min-width:0;--padl:132px}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lab{position:absolute;left:0;top:0;width:calc(var(--padl) - 16px);text-align:right;direction:rtl;line-height:1;white-space:nowrap;transition:color .3s,opacity .4s;will-change:transform;padding:6px 0}
.lab:hover,.lab.on{color:var(--ink)}
.lab.hot,.lab.on{color:var(--ct)}
.lab.on{cursor:pointer}
.lab.on::after{content:"\2190";margin-left:8px;margin-right:6px;color:var(--ink-48);font-size:11px;opacity:0;transition:opacity .2s}
.lab.on:hover::after{opacity:1}
.lab.on:hover{color:var(--ink)}
.lab.off{opacity:0;pointer-events:none}
.marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rc{position:absolute;white-space:nowrap;font-size:14px;line-height:1;opacity:0;transform:translateY(6px);transition:opacity .28s var(--ease),transform .5s var(--ease);color:var(--ink-72)}
.rc.in{opacity:1;transform:none}
.rc.out{opacity:0;transition:opacity .35s}
.rc b{font-weight:500;color:var(--ct);margin-right:8px}
.rc span{color:var(--ink-48);margin-left:8px;font-size:13px}
.th{position:absolute;width:1px;margin-left:-.5px;transform:scaleY(0);transition:transform .24s cubic-bezier(.5,0,.2,1),opacity .7s}
.th.dn{transform-origin:50% 0;background:linear-gradient(to bottom,transparent,var(--c) 55%)}
.th.up{transform-origin:50% 100%;background:linear-gradient(to top,transparent,var(--c) 55%)}
.th.in{transform:scaleY(1)}
.th.out{opacity:0}
.ring{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border:1.5px solid var(--c);border-radius:50%;opacity:1;transform:scale(.4);transition:transform 1.1s var(--ease),opacity 1.1s var(--ease)}
.ring.in{transform:scale(3.6);opacity:0}
.tk{position:absolute;left:0;top:0;width:0;height:0}
.tk::before{content:"";position:absolute;left:-1px;top:-4px;width:2px;height:8px;border-radius:1px;background:var(--c);transform:scaleY(0);transition:transform .5s var(--ease)}
.tk.in::before{transform:scaleY(1)}
.mv{position:absolute;left:0;top:0;width:0;height:0;transition:opacity .5s}
.mv::before{content:"";position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--paper)}
.mv .k{position:absolute;left:-4px;bottom:18px;white-space:nowrap;color:var(--ink);transition:opacity .6s;text-shadow:0 0 6px var(--paper),0 0 2px var(--paper),0 0 10px var(--paper)}
.mv.quiet .k{opacity:0}
.mv.gone{opacity:0}

.livebox{position:absolute;left:var(--padl);right:0;bottom:0;height:24px;opacity:0;transition:opacity .4s var(--ease)}
.livebox.on{opacity:1}
.live{display:flex;align-items:center;gap:10px;height:24px;font-size:14px;line-height:1;white-space:nowrap;color:var(--ink-72)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none;animation:pulse 1.1s ease-in-out infinite}
.live.wait i{animation:none;background:var(--paper);border:1.5px solid var(--c)}
.live b{font-weight:500;color:var(--ct)}
.live .s{overflow:hidden;text-overflow:ellipsis;min-width:0;transition:opacity .25s}
.live .s.swap{opacity:0}
.live .t{margin-left:auto;color:var(--ink-48);font-size:13px;font-variant-numeric:tabular-nums}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.foot{display:none}

@media (max-width:900px){
  .body{--padl:0px}
  .divider{margin-left:0}
  .field{--padl:100px;margin-bottom:30px}
  .top-right .k:first-child{display:none}
  .log{top:52px}
  .log li{grid-template-columns:4.6em minmax(0,1fr)}
  .log li .k:last-child{display:none}
  .livebox{top:100%;bottom:auto;margin-top:8px;left:0}
  .live .t{display:none}
  .rc.tick{left:0;right:0;bottom:-30px;text-align:left;font-size:14px;overflow:hidden;text-overflow:ellipsis}
}
  .marks{overflow:visible}
  .mv .k{display:none}
  .field{margin-bottom:34px}
}
@media (prefers-reduced-motion:reduce){ .pane,.log{animation:none} }

  var g=C.gates[i];g.cleared=true;C.gated=false;
  F.pulses=F.pulses.filter(function(p){return p!==C.gatePulse;});
  msg({text:"Done. Carrying on.",att:'<div class="status"><span><b id="clock">'+clockLabel(C.h)+'</b> · <span id="elapsed">'+elapsedLabel(C.h)+'</span></span><span><b id="count">'+C.i+'</b> of '+C.n+' done</span></div><div class="prog" id="pbar">'+C.lines.slice(0,C.i+1).map(function(l){return '<i style="--c:'+COLORS[FUNCS.indexOf(l[0])]+';flex-basis:'+(100/C.n)+'%"></i>';}).join("")+'</div><ul class="feed" id="feed"></ul><div id="gatebox"></div>'});
  var l=C.lines[i];land(i,[l[0],g.label.replace(/^(Countersign|Approve|Ship|Send)( it)?/,function(m){return {Countersign:"Countersigned",Approve:"Approved",Ship:"Shipped",Send:"Sent"}[m.split(" ")[0]];}),l[2]],s,x0,true);
  C.i++;
}
function after(){
  S.stateView="after";enter("after");
  var d=DECISIONS[S.i],k=S.picks[S.i],lines=d.cascade[k],fns=[];
  lines.forEach(function(l){if(fns.indexOf(l[0])<0)fns.push(l[0]);});
  tintFor(lines,0.16);
  var last=S.i===DECISIONS.length-1;
  var counts={};lines.forEach(function(l){counts[l[0]]=(counts[l[0]]||0)+1;});
  var names=fns.map(function(f){return '<button type="button" style="--c:'+COLORS[FUNCS.indexOf(f)]+'" data-room="'+esc(f)+'">'+esc(f)+'</button>';});
  var list=names.length<2?names.join(""):names.slice(0,-1).join(", ")+" and "+names[names.length-1];
  msg({c:COLORS[FUNCS.indexOf(d.fn)],side:esc(d.fn)+' · '+esc(d.opts[k].past),
       text:"Done. "+lines.length+" things across "+list+"."+(d.opts[k].risk?" "+esc(d.opts[k].risk):" Open any of them to see exactly what was done."),
       att:'<div class="split" aria-hidden="true">'+fns.map(function(f){return '<i style="--c:'+COLORS[FUNCS.indexOf(f)]+';flex:'+counts[f]+'"></i>';}).join("")+'</div>',
       replies:'<button type="button" class="rp p" id="next">'+(last?"See the day":"Next decision")+'</button>'});
  if(S.watching)later(next,3200);
}
function next(){clearTimers();if(S.i<DECISIONS.length-1){S.i++;card();}else tally();}

function tally(){
  S.stateView="tally";enter("tally");clearMarks();stopWatching();tintFor(null);
  var total=0,tools={};
  DECISIONS.forEach(function(d,i){d.cascade[S.picks[i]].forEach(function(l){total++;if(l[2])tools[l[2]]=1;});});
  var c={};DECISIONS.forEach(function(d,i){d.cascade[S.picks[i]].forEach(function(l){c[l[0]]=(c[l[0]]||0)+1;});});
  msg({c:COLORS[6],side:'Halden · day done',
       text:"That was one day. <b>"+DECISIONS.length+" moves from you, "+total+" from the fleet</b>, across "+Object.keys(tools).length+" tools. Nothing else needed you. Now imagine it’s yours.",
       att:'<div class="split" aria-hidden="true">'+FUNCS.filter(function(f){return c[f];}).map(function(f){return '<i style="--c:'+COLORS[FUNCS.indexOf(f)]+';flex:'+c[f]+'"></i>';}).join("")+'</div>',
       replies:'<a class="rp cta" href="https://mutiny.ai/intake/" target="_blank" rel="noopener">Start company<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a><button type="button" class="rp" id="again">Play again</button>'});
  sweep();
}
/* one front crossing every line, a beat apart, so the whole company moves as a single wave */
function sweep(){
  if(S.view!=="tally")return;
  for(var s=0;s<NS;s++)travel(s,true,0.0,1.0,2.6,13,0.05,{delay:s*0.07,ease:easeInOut,rise:0.15,fall:0.25,sway:0.1});
  later(sweep,6500);
}

function room(name){
  var idx=FUNCS.indexOf(name),r=ROOMS[name]; if(idx<0||!r)return;
  clearTimers();stopWatching();clearMarks();tintFor(null);
  if(S.view!=="room")S.back=S.keepGrid?"grid":S.view;
  S.room=idx;enter("room");
  var mine=F.ticks.filter(function(t){return t.s===idx;}).slice().reverse();
  var fresh=(S.done[name]||[]).map(function(l){return '<li class="new"><span class="k">Just now</span><span class="a">'+esc(l[1])+'</span><span class="k">'+esc(l[2])+'</span></li>';}).join("");
  var old=r.log.slice().reverse().map(function(l){return '<li><span class="k">'+esc(l[0])+'</span><span class="a">'+esc(l[1])+'</span><span class="k">'+esc(l[2])+'</span></li>';}).join("");
  msg({c:COLORS[idx],side:esc(name)+' · '+(r.wait?'waiting on you':'running'),
       text:"Here’s "+esc(name)+". <b>"+esc(r.num)+"</b>, "+esc(r.cap)+"."+(r.wait?" "+esc(r.wait):""),
       replies:'<button type="button" class="rp" id="back">Back to the company</button>',cls:"room"});
  var more=(S.done[name]||[]).length+r.log.length>3;S.roomMode=S.roomMode||"split";
  logwrap.innerHTML='<div class="modes" role="tablist">'+["brief","split","live"].map(function(m){return '<button type="button" data-mode="'+m+'" class="'+(m===S.roomMode?"on":"")+'">'+({brief:"Brief",split:"Split",live:"Live"})[m]+'</button>';}).join("")+'<span class="sep"></span><button type="button" class="ic" data-snap="max" aria-label="Fill the screen" title="Fill the screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button type="button" class="ic" data-snap="min" aria-label="Show the chat" title="Show the chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg></button></div>'+
    '<div class="roompanel m-'+S.roomMode+'" id="roompanel" style="--c:'+COLORS[idx]+'"><div class="briefcol"><div class="log"><ol>'+fresh+old+'</ol>'+(more?'<button type="button" class="more" id="more">Show more</button>':'')+'</div><div class="wgs">'+(WIDGETS[name]?WIDGETS[name]():'')+'</div></div><div class="lvcol">'+liveSurface(name)+'</div></div>';
  logwrap.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){S.roomMode=b.getAttribute("data-mode");logwrap.querySelectorAll("[data-mode]").forEach(function(x){x.classList.toggle("on",x===b);});$("roompanel").className="roompanel m-"+S.roomMode;});});
  var mb=$("more");if(mb)mb.addEventListener("click",function(){var lg=mb.parentNode;lg.classList.toggle("open");mb.textContent=lg.classList.contains("open")?"Show less":"Show more";});
  var rows=logwrap.querySelectorAll("li");
  rows.forEach(function(li,i){li.addEventListener("mouseenter",function(){
    var isNew=li.classList.contains("new"),x=(isNew&&mine[i])?mine[i].x:0.1+0.8*(i+0.5)/rows.length;
    swell(idx,isNew,x,1.6,12,0.03);
  });});
  travel(idx,false,0.0,1.0,2.2,12,0.06,{delay:0.35,rise:0.15,fall:0.25});
}
function gridView(){
  clearTimers();stopWatching();clearMarks();tintFor(null);
  var was=S.view;
  S.view="grid";S.keepGrid=true;setProg();labelState();field.classList.add("grid");logwrap.innerHTML=liveGrid();
  viewAll.textContent="Lines";
  if(was==="room"||was==="grid"){S.back=null;S.room=null;({card:card,after:after,tally:tally})[S.stateView||"card"]();}
}
function goBack(){if(S.back==="grid"){S.back=null;S.room=null;gridView();return;}var b=S.back||"card";S.back=null;S.room=null;if(b==="after")after();else if(b==="tally")tally();else card();}
function stopWatching(){S.watching=false;watchBtn.textContent="Watch it play";}
function reset(){clearTimers();S.i=0;S.picks=[];S.done={};S.back=null;S.room=null;ticksEl.innerHTML="";F.ticks=[];card();}

/* ================= the chat ================= */
function rebelSay(html){msg({text:html});}
function askRebel(q){
  var t=q.trim();if(!t)return;
  you(t);
  var low=t.toLowerCase(),hit=null;
  if(S.view==="card"){var d=DECISIONS[S.i],pk=null;["a","b"].forEach(function(k){var lab=d.opts[k].label.toLowerCase(),words=lab.split(" ").filter(function(w){return w.length>3;});if(words.some(function(w){return low.indexOf(w)>=0;}))pk=k;});if(!pk&&/^(yes|do it|go|ok|okay|agreed|sure)/.test(low))pk=d.rec;if(pk){stopWatching();pick(pk);return;}}
  if(C&&C.gated&&/(sign|approve|ship|send|yes|do it|go ahead|ok)/.test(low)){var gi=C.i,gl=C.lines[gi],gs=FUNCS.indexOf(gl[0]);clearGate(gi,gs,C.XA+(C.XB-C.XA)*(C.hrs[gi]/C.H));return;}
  FUNCS.forEach(function(f){if(low.indexOf(f.toLowerCase())>=0)hit=f;});
  if(!hit){var alias={money:"Finance",cash:"Finance",revenue:"Finance",pipeline:"RevOps",deals:"Sales",customers:"Support",tickets:"Support",hipaa:"Compliance",ads:"Marketing",seo:"AI answers",people:"Payroll",hire:"Hiring"};Object.keys(alias).forEach(function(k){if(low.indexOf(k)>=0)hit=alias[k];});}
  if(hit){room(hit);return;}
  if(/next|continue|go on|see the day/.test(low)&&S.view==="after"){next();return;}
  if(/^back|lines$/.test(low)&&S.view==="room"){goBack();return;}
  if(/(start|play) again|reset/.test(low)){reset();return;}
  rebelSay("This is a sample company, so here I can open any part of it for you. Try “show me finance” or “what’s waiting in legal”. In your own company I answer anything, and I can act on it.");
}
$("askform").addEventListener("submit",function(e){e.preventDefault();var inp=$("askinput");askRebel(inp.value);inp.value="";});

/* ================= the divider ================= */
var bodyEl=document.querySelector(".body"),dv=$("divider");
function snap(mode){bodyEl.classList.remove("min","max","sized");if(mode==="min"||mode==="max")bodyEl.classList.add(mode);scrollTray();}
document.addEventListener("click",function(e){var b=e.target.closest("[data-snap]");if(!b)return;S.touched=true;var m=b.getAttribute("data-snap");if(bodyEl.classList.contains("min")||bodyEl.classList.contains("max"))snap("");else snap(m);});
(function(){
  var start=null;
  dv.addEventListener("pointerdown",function(e){if(e.target.closest("[data-snap]"))return;start={y:e.clientY,h:document.querySelector(".tray").getBoundingClientRect().height};dv.classList.add("drag");dv.setPointerCapture(e.pointerId);});
  dv.addEventListener("pointermove",function(e){if(!start)return;var avail=bodyEl.getBoundingClientRect().height-dv.offsetHeight-document.querySelector(".chat").offsetHeight-40;var h=Math.max(0,Math.min(avail,start.h+(start.y-e.clientY)));
    bodyEl.classList.remove("min","max");bodyEl.classList.add("sized");bodyEl.style.setProperty("--trayset",h+"px");
    if(h<30)snap("max");else if(h>avail-30)snap("min");});
  dv.addEventListener("pointerup",function(){start=null;dv.classList.remove("drag");});
  dv.addEventListener("dblclick",function(){snap("");});
})();
/* a new message while the chat is hidden brings the chat back */
var _msg=msg;msg=function(o){if(bodyEl.classList.contains("max"))snap("");_msg(o);};

/* ================= events ================= */
document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t||t===watchBtn)return;
  S.touched=true;
  if(t.hasAttribute("data-pick")){stopWatching();you(t.textContent.replace(/ instead$/,""));pick(t.getAttribute("data-pick"));}
  else if(t.hasAttribute("data-room")){if(S.view==="cascade")return;var rn=t.getAttribute("data-room");if(S.view==="room"&&FUNCS.indexOf(rn)===S.room){you("Back to the company.");goBack();return;}you("Show me "+rn.toLowerCase()+".");room(rn);}
  else if(t.id==="next"){stopWatching();you(t.textContent);next();}
  else if(t.id==="back"){you("Back to the company.");goBack();}
  else if(t.id==="again")reset();
});
labelsEl.addEventListener("mouseover",function(e){
  var l=e.target.closest(".lab");if(!l||S.view==="room"||S.view==="cascade")return;
  travel(+l.getAttribute("data-i"),false,0.0,0.5,1.6,11,0.04,{ease:easeOut,rise:0.08,fall:0.6});
});
viewAll.addEventListener("click",function(){S.touched=true;if(S.keepGrid){S.keepGrid=false;S.back=null;S.room=null;({card:card,after:after,tally:tally})[S.stateView||"card"]();}else gridView();});
paceBtn.addEventListener("click",function(){S.real=!S.real;paceBtn.textContent=S.real?"Real time":"Fast";if(C&&!C.done){var d=DECISIONS[S.i],n=C.n,T=S.real?Math.min(44,16+C.H*0.5):(0.55+n*0.31);C.rate=C.H/T;}});
watchBtn.addEventListener("click",function(){
  S.touched=true;
  if(S.watching){stopWatching();clearTimers();var a=left.querySelector(".auto");if(a)a.classList.remove("auto");tintFor(null);return;}
  S.watching=true;watchBtn.textContent="Stop";
  if(S.view==="tally"||S.view==="room")reset();else if(S.view==="after")later(next,1200);else if(S.view==="card")card();
});

/* ================= boot ================= */
buildLabels();colors();
F.ok=initGL();
layout();
window.addEventListener("resize",layout);
if("ResizeObserver" in window){var ro=new ResizeObserver(function(){layout();});ro.observe(field);}
if(window.matchMedia){var mq=window.matchMedia("(prefers-color-scheme: dark)");(mq.addEventListener?mq.addEventListener.bind(mq,"change"):mq.addListener.bind(mq))(colors);}
if("IntersectionObserver" in window){new IntersectionObserver(function(en){F.visible=en[0].isIntersecting;clock.last=0;}).observe(field);}
if(!F.ok){
  canvas.style.display="none";
  var st=document.createElement("style");st.textContent=".lab::after{content:'';position:absolute;left:calc(100% + 16px);top:50%;width:100vw;height:1px;background:var(--ink-28)}";document.head.appendChild(st);
}
card();
requestAnimationFrame(frame);
ambient();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
})();
</script>
